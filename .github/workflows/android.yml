name: Android Release CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APK & Publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Secrets & Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Configure Keystore for Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CUSTOM_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          CUSTOM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${CUSTOM_STORE_PASSWORD:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${CUSTOM_KEY_PASSWORD:-android}" >> $GITHUB_ENV
          elif [ ! -f my-upload-key.jks ]; then
            echo "Generating release signing keystore..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=N Lock, OU=Android, O=NLock, L=City, S=State, C=US"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/N-Lock-release.apk

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: N-Lock-Release-APK
          path: release-output/N-Lock-release.apk
          retention-days: 30

      - name: Determine Release Tag and Title
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_title=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            TAG="v1.0.${{ github.run_number }}"
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
            echo "release_title=Release $TAG (main)" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-output/N-Lock-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
